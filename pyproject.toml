[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pas2-python-topological-sort"
version = "0.1.0"
description = "Sort dependency graphs and report cycles without recursive traversal."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "1Pas2"}]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
